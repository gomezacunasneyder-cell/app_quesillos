<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5B9AA0">
  <title>Pedidos | Quesillos Emmanuel</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="dashboard-page">
  <div id="admin-panel" class="dashboard" hidden>
    <header class="topbar">
      <a class="brand-mark" href="./panel.html" aria-label="Panel Quesillos Emmanuel">
        <span class="brand-mark__icon" aria-hidden="true">Q</span>
        <span>Quesillos <strong>Emmanuel</strong></span>
      </a>
      <nav class="topbar__nav" aria-label="Secciones del panel">
        <a class="topbar__link is-active" href="./panel.html" aria-current="page">Pedidos</a>
        <a class="topbar__link" href="./ventas.html">Ventas</a>
        <button id="logout-button" class="button button--quiet" type="button">Cerrar sesión</button>
      </nav>
    </header>

    <main class="dashboard-main">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Administración</p>
          <h1>Pedidos activos</h1>
        </div>
        <div class="pending-count" aria-live="polite">
          <span id="pending-count">0</span>
          <span>activos</span>
        </div>
      </div>

      <div id="new-order-notice" class="notice" role="status" aria-live="polite" hidden>
        <span class="notice__text">🔔 Nuevo pedido recibido</span>
        <button id="dismiss-notice" class="notice__close" type="button" aria-label="Cerrar notificación">×</button>
      </div>

      <p id="orders-error" class="message message--error" role="alert" hidden></p>
      <p id="orders-loading" class="empty-state">Cargando pedidos…</p>
      <section id="orders-list" class="orders-list" aria-label="Lista de pedidos activos"></section>
      <p id="orders-empty" class="empty-state" hidden>No hay pedidos activos.</p>

      <section class="history-section">
        <details class="history-details">
          <summary>Entregados a domicilio (<span id="history-domicilio-count">0</span>)</summary>
          <div id="history-domicilio-list" class="orders-list orders-list--history"></div>
          <p id="history-domicilio-empty" class="empty-state" hidden>Aún no hay entregas a domicilio completadas.</p>
        </details>

        <details class="history-details">
          <summary>Recogidos en tienda (<span id="history-recoge-count">0</span>)</summary>
          <div id="history-recoge-list" class="orders-list orders-list--history"></div>
          <p id="history-recoge-empty" class="empty-state" hidden>Aún no hay recogidas en tienda completadas.</p>
        </details>
      </section>
    </main>
  </div>
  <script type="module" src="/src/admin/auth.ts"></script>
  <script type="module" src="/src/admin/panel.ts"></script>
</body>
</html>
